<!DOCTYPE html>
<html>
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-secondary mb-3">← Back to Dashboard</a>
        <div class="card p-4 shadow-sm">
            <h3>Manage Classes</h3>
            <form action="/add_class" method="POST" class="row g-3">
                <div class="col-auto"><input type="text" name="class_name" class="form-control" placeholder="Class Name (e.g. Grade 10)" required></div>
                <div class="col-auto"><button type="submit" class="btn btn-primary">Save Class</button></div>
            </form>
            <hr>
            <table class="table">
                <thead><tr><th>ID</th><th>Class Name</th></tr></thead>
                <tbody>
                    {% for c in classes %}
                    <tr><td>{{ c.id }}</td><td>{{ c.className }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
