<!DOCTYPE html>
<html>
<head><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
    <div class="container py-5">
        <a href="/" class="btn btn-secondary mb-3">← Back to Dashboard</a>
        <div class="card p-4 shadow-sm">
            <h3>Manage Students</h3>
            <form action="/add_student" method="POST" class="row g-3">
                <div class="col-auto"><input type="text" name="name" class="form-control" placeholder="Student Name" required></div>
                <div class="col-auto">
                    <select name="class_id" class="form-select">
                        {% for c in classes %}<option value="{{ c.id }}">{{ c.className }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-auto"><button type="submit" class="btn btn-success">Add Student</button></div>
            </form>
            <hr>
            <table class="table">
                <thead><tr><th>Name</th><th>Assigned Class</th></tr></thead>
                <tbody>
                    {% for s in students %}
                    <tr><td>{{ s.name }}</td><td>{{ s.className }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
