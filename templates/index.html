<!DOCTYPE html>
<html>
<head>
    <title>AMS Pro - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #212529; color: white; padding-top: 20px; }
        .nav-link { color: #adb5bd; margin-bottom: 10px; }
        .nav-link:hover { color: white; background: #343a40; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 sidebar px-3">
                <h4 class="text-center">AMS ADMIN</h4><hr>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="/">📊 Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/manage_classes">🏫 Classes</a></li>
                    <li class="nav-item"><a class="nav-link" href="/manage_students">🎓 Students</a></li>
                    <li class="nav-item"><a class="nav-link text-danger mt-5" href="/logout">🚪 Logout</a></li>
                </ul>
            </nav>
            <main class="col-md-10 p-4 bg-light">
                <h2>System Overview</h2>
                <div class="row mb-4">
                    <div class="col-md-3"><div class="card p-3 shadow-sm border-primary"><h6>TOTAL STUDENTS</h6><h3>{{ s_count }}</h3></div></div>
                    <div class="col-md-3"><div class="card p-3 shadow-sm border-success"><h6>TOTAL CLASSES</h6><h3>{{ c_count }}</h3></div></div>
                </div>
                <div class="card shadow-sm p-3">
                    <h5>Quick Attendance List</h5>
                    <table class="table table-hover">
                        <thead><tr><th>Name</th><th>Class</th></tr></thead>
                        <tbody>
                            {% for s in students %}
                            <tr><td>{{ s.name }}</td><td><span class="badge bg-secondary">{{ s.className or 'N/A' }}</span></td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
